# FSH Open Mercato baseline CI — PR gate. Target-agnostic (no deploy).
# Drop into .github/workflows/ci.yml at the monorepo root.
# Assumes a thin root delegating to apps/mercato; Postgres service matches apps/mercato/.env.example defaults.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mercato
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open-mercato
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
        working-directory: .
      - name: Install
        run: yarn install --immutable
      - name: Prepare env
        run: cp .env.example .env
      - name: Generate
        run: yarn generate
      - name: Migrate
        run: yarn db:migrate
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
    # Redis/Meilisearch are NOT needed for lint/typecheck/unit tests (queue defaults to
    # filesystem, search defaults to Postgres). Add them as services here if/when
    # integration tests require them.

  # Slack alert when main breaks (FSH convention). Fires only on push-to-main failure.
  # Requires org/repo secret FSH_SLACK_BOT_TOKEN. Delete this job if you don't use Slack.
  notify-failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: fullstackhouse/slack-notify-action@v1
        with:
          bot-token: ${{ secrets.FSH_SLACK_BOT_TOKEN }}
          channel: "#fsh-alerts"
          title: "CI failed on main"
          message: "Tests failed on `main` after merge. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status: failure
