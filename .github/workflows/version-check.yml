name: version-check

# Guards against the silent "skill merged but consumers never get it" bug:
# Claude Code keys plugin freshness on plugin.json's `version` string, so any
# change to a skill (or the plugin manifest) MUST raise the version, or existing
# installs stay frozen. See README "Releasing".

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require plugin.json version bump when skills change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          manifest=".claude-plugin/plugin.json"

          base_version="$(git show "$BASE_SHA:$manifest" 2>/dev/null | jq -r '.version // empty' || true)"
          head_version="$(jq -r '.version // empty' "$manifest")"

          if [ -z "$head_version" ]; then
            echo "::error file=$manifest::Missing \"version\" in $manifest"
            exit 1
          fi

          echo "base version: ${base_version:-<none>}"
          echo "head version: $head_version"

          # First time the manifest exists on this branch — nothing to compare against.
          if [ -z "$base_version" ]; then
            echo "No base version to compare; accepting $head_version."
            exit 0
          fi

          if [ "$base_version" = "$head_version" ]; then
            echo "::error file=$manifest::This PR changes skills/** or .claude-plugin/** but leaves version at $base_version. Bump \"version\" in $manifest (SemVer) so installed plugins actually receive the change. See README \"Releasing\"."
            exit 1
          fi

          # Reject downgrades. `sort -V` puts the lower SemVer first; the head
          # version must NOT be the lower of the two.
          lower="$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | head -n1)"
          if [ "$lower" = "$head_version" ]; then
            echo "::error file=$manifest::version went backwards ($base_version -> $head_version). Bump it forward."
            exit 1
          fi

          echo "OK: version bumped $base_version -> $head_version"
