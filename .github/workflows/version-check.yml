name: version-check

# Guards against the silent "skill merged but consumers never get it" bug:
# Claude Code keys plugin freshness on plugin.json's `version` string, so any
# change to a skill (or the plugin manifest) MUST raise the version, or existing
# installs stay frozen. See README "Releasing".

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require plugin.json version bump when skills change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          manifest=".claude-plugin/plugin.json"

          # Distinguish "no manifest on base" (genuinely the first time) from
          # "could not read it" (malformed JSON, missing jq, unfetched base).
          # The old `|| true` collapsed both into an empty string, and the empty
          # string is accepted below — so any error silently skipped the check.
          if git cat-file -e "$BASE_SHA:$manifest" 2>/dev/null; then
            base_version="$(git show "$BASE_SHA:$manifest" | jq -r '.version // empty')"
            if [ -z "$base_version" ]; then
              echo "::error file=$manifest::base commit's $manifest has no readable \"version\""
              exit 1
            fi
          else
            base_version=""
          fi
          head_version="$(jq -r '.version // empty' "$manifest")"

          if [ -z "$head_version" ]; then
            echo "::error file=$manifest::Missing \"version\" in $manifest"
            exit 1
          fi

          echo "base version: ${base_version:-<none>}"
          echo "head version: $head_version"

          # First time the manifest exists on this branch — nothing to compare against.
          if [ -z "$base_version" ]; then
            echo "No base version to compare; accepting $head_version."
            exit 0
          fi

          if [ "$base_version" = "$head_version" ]; then
            echo "::error file=$manifest::This PR changes skills/** or .claude-plugin/** but leaves version at $base_version. Bump \"version\" in $manifest (SemVer) so installed plugins actually receive the change. See README \"Releasing\"."
            exit 1
          fi

          # Reject downgrades. NOT `sort -V`: it orders `2.0.0-rc.1` ABOVE
          # `2.0.0`, so promoting a release candidate to its final version
          # would read as a downgrade and fail this gate. See the script.
          cmp="$(python3 .github/scripts/semver_cmp.py "$base_version" "$head_version")"
          if [ "$cmp" != "-1" ]; then
            echo "::error file=$manifest::version went backwards ($base_version -> $head_version). Bump it forward."
            exit 1
          fi

          # The RC channel publishes pre-release versions from `next`. If one
          # reaches the default branch, every `fsh` consumer on autoUpdate gets
          # it as their stable release — and the check above cannot catch it,
          # since 1.12.0 -> 2.0.0-rc.5 is a legitimate forward bump.
          if [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            case "$head_version" in
              *-*)
                echo "::error file=$manifest::$head_version is a pre-release and this PR targets $DEFAULT_BRANCH. Pre-releases belong on \`next\` (the fsh-rc channel); promote to a final version before merging here."
                exit 1
                ;;
            esac
          fi

          echo "OK: version bumped $base_version -> $head_version"
